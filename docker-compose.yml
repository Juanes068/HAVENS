services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: havens_db
      MYSQL_ROOT_PASSWORD: Juanes068
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 5s

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DB_NAME=havens_db
      - DB_USER=root
      - DB_PASSWORD=Juanes068
      - DB_HOST=db
      - DB_PORT=3306

  celery:
    build: .
    command: sh -c "python manage.py migrate && celery -A havens worker -l info"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DB_NAME=havens_db
      - DB_USER=root
      - DB_PASSWORD=Juanes068
      - DB_HOST=db
      - DB_PORT=3306
