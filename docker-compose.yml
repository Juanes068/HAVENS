services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: havens_db
      MYSQL_ROOT_PASSWORD: Juanes068
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pJuanes068"]
      timeout: 5s
      retries: 5
      interval: 3s
      start_period: 60s
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  web:
    container_name: havens-web-app
    build: .
    command: sh -c "pip install -r requirements.txt && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - DB_NAME=havens_db
      - DB_USER=root
      - DB_PASSWORD=Juanes068
      - DB_HOST=db
      - DB_PORT=3306

  celery:
    build: .
    command: sh -c "pip install -r requirements.txt && python manage.py migrate && celery -A havens worker -l info"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - DB_NAME=havens_db
      - DB_USER=root
      - DB_PASSWORD=Juanes068
      - DB_HOST=db
      - DB_PORT=3306

  frontend:
    container_name: havens-frontend
    build:
      context: ./havens-web
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
    ports:
      - "5173:5173"
    volumes:
      - ./havens-web:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
    depends_on:
      - web

volumes:
  db_data:
  redis_data:
  frontend_node_modules:
