services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: havens_db
      MYSQL_ROOT_PASSWORD: Juanes068
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pJuanes068"]
      timeout: 5s
      retries: 5
      interval: 3s
      start_period: 60s
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DB_NAME=havens_db
      - DB_USER=root
      - DB_PASSWORD=Juanes068
      - DB_HOST=db
      - DB_PORT=3306

  celery:
    build: .
    command: sh -c "python manage.py migrate && celery -A havens worker -l info"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - DB_NAME=havens_db
      - DB_USER=root
      - DB_PASSWORD=Juanes068
      - DB_HOST=db
      - DB_PORT=3306

volumes:
  db_data:
  redis_data:
