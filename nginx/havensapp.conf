# ─── HTTP: Redirect all HTTP → HTTPS ─────────────────────────────────────────
server {
    listen 80;
    server_name havensapp.com www.havensapp.com api.havensapp.com;

    # Let's Encrypt / Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS: React Frontend → havensapp.com ────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name havensapp.com www.havensapp.com;

    # SSL certificates from Let's Encrypt (Certbot)
    ssl_certificate     /etc/letsencrypt/live/havensapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/havensapp.com/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Serve built React app (Vite dist)
    root /var/www/havensapp;
    index index.html;

    # React Router — all routes fall back to index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static JS/CSS/images aggressively (they have content hashes)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    client_max_body_size 20M;
}

# ─── HTTPS: Django API → api.havensapp.com ───────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.havensapp.com;

    # SSL certificates (same cert if using wildcard, or a separate cert for api subdomain)
    ssl_certificate     /etc/letsencrypt/live/havensapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/havensapp.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20M;

    # GraphQL API — proxy to Gunicorn (Django)
    location /graphql/ {
        proxy_pass         http://web:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Django Admin panel
    location /admin/ {
        proxy_pass         http://web:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Django-collected static files (admin CSS, etc.)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Media files (user uploads)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Health check endpoint
    location /health/ {
        proxy_pass http://web:8000;
        access_log off;
    }
}
